# Minimal example for deploying k3s-status-dashboard on Kubernetes / k3s.
#
# This dashboard does NOT talk to the cluster API — it actively probes your
# services (HTTP/TCP via their in-cluster Service DNS) and optionally reads node
# health from Prometheus. So it needs no ServiceAccount, no RBAC: just a
# Deployment, a Service, and a config with the services to watch.
#
#   kubectl apply -f deploy.example.yaml
#
# Reach it via port-forward, a LoadBalancer Service, or your own Ingress /
# Traefik IngressRoute (examples at the bottom, commented out).
---
apiVersion: v1
kind: Namespace
metadata:
  name: status
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-dashboard-config
  namespace: status
data:
  config.json: |
    {
      "title": "My Homelab Status",
      "prometheusUrl": "http://prometheus.monitoring.svc.cluster.local:9090",
      "services": [
        { "name": "Nextcloud", "http": "http://nextcloud.nextcloud.svc.cluster.local/status.php" },
        { "name": "Grafana", "http": "http://grafana.monitoring.svc.cluster.local:3000/api/health" },
        { "name": "Mail (SMTP)", "tcp": "smtp.mail.svc.cluster.local:25" },
        { "name": "Mail (IMAP)", "tcp": "imap.mail.svc.cluster.local:143" }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-dashboard
  namespace: status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status-dashboard
  template:
    metadata:
      labels:
        app: status-dashboard
    spec:
      containers:
        - name: status-dashboard
          image: schnippi78/k3s-status-dashboard:latest
          ports:
            - containerPort: 3000
          env:
            - name: CONFIG_PATH
              value: /app/config.json
            # Or skip the ConfigMap and pass everything inline:
            # - name: SERVICES_CONFIG
            #   value: '{"title":"Inline","services":[{"name":"Pi","http":"http://pi.default.svc.cluster.local/"}]}'
            # - name: PROBE_TIMEOUT
            #   value: "3000"
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: status-dashboard-config
---
apiVersion: v1
kind: Service
metadata:
  name: status-dashboard
  namespace: status
spec:
  selector:
    app: status-dashboard
  ports:
    - port: 80
      targetPort: 3000
# ---
# Optional: expose via Traefik IngressRoute (k3s default ingress).
# Put it behind auth before opening it to the public internet.
